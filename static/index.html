<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地工具集</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page page-hub">
    <header class="header header-center">
      <h1>本地工具集</h1>
      <p class="subtitle">在本地完成处理，文件不会上传到第三方</p>
    </header>

    <div class="tool-grid">
      <a class="tool-card" href="/video.html">
        <div class="tool-icon tool-icon-video" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="4" y="8" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M22 14l6-3.5v11L22 18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <h2>视频转音频</h2>
        <p>从视频中提取 MP3、WAV、AAC 等音频</p>
      </a>

      <a class="tool-card" href="/video-compress.html">
        <div class="tool-icon tool-icon-video" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="5" y="9" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M21 14l5-3v10l-5-3" stroke="currentColor" stroke-width="1.5"/><path d="M9 18h6M9 14h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <h2>视频压缩</h2>
        <p>降低分辨率与码率，缩小视频体积</p>
      </a>

      <a class="tool-card" href="/image.html">
        <div class="tool-icon tool-icon-image" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="4" y="6" width="24" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="13" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 22l7-6 5 4 6-7 6 9" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <h2>图片压缩</h2>
        <p>在尽量保持画质的前提下缩小体积</p>
      </a>

      <a class="tool-card" href="/image-convert.html">
        <div class="tool-icon tool-icon-image" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="6" y="6" width="20" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M11 21l4-5 3 3 5-7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <h2>图片转换</h2>
        <p>格式转换、调整尺寸与裁剪</p>
      </a>

      <a class="tool-card" href="/json.html">
        <div class="tool-icon tool-icon-data" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M8 10h4a3 3 0 010 6H8M8 10v12M24 10h-4a3 3 0 000 6h4M24 10v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <h2>JSON 格式化</h2>
        <p>格式化、压缩与校验 JSON 文本</p>
      </a>

      <a class="tool-card" href="/base64.html">
        <div class="tool-icon tool-icon-data" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="6" y="8" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 16h12M16 12v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <h2>Base64 编解码</h2>
        <p>文本与文件的 Base64 互转</p>
      </a>

      <a class="tool-card" href="/csv-excel.html">
        <div class="tool-icon tool-icon-data" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="6" y="6" width="20" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M6 12h20M6 18h20M14 6v20" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
        <h2>CSV ↔ Excel</h2>
        <p>CSV 与 Excel 表格互转</p>
      </a>
    </div>
  </div>
</body>
</html>

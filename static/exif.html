<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="exif.title">EXIF 清除</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css?v=20261025q" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/" data-i18n="nav.all">← 全部工具</a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>
    <header class="header">
      <div class="logo logo-image" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><rect x="4" y="6" width="24" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="13" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 22l7-6 5 4 6-7 6 9" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 8h4M24 6v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1 data-i18n="exif.title">EXIF 清除</h1>
        <p class="subtitle" data-i18n="exif.sub">查看并去掉拍摄时间、机型、GPS 等隐藏信息，免费且不出本机</p>
      </div>
    </header>
    <main class="card">
      <p class="field-hint" data-i18n="exif.hint">EXIF 是照片里附带的拍摄信息。清除后画面还在，位置和设备信息会被去掉。</p>
      <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff" multiple hidden />
      <section class="dropzone" id="dropzone" tabindex="0" role="button" data-i18n-aria="image.dropAria">
        <p class="dropzone-title" data-i18n="exif.drop">拖放图片到此处，或点击选择（可多选）</p>
        <p class="dropzone-hint" data-i18n="exif.dropHint">支持 JPG、PNG、WebP、BMP、TIFF · 单文件 50MB · 批量合计 200MB</p>
      </section>
      <div class="file-preview hidden" id="filePreview">
        <div class="file-info">
          <span class="file-name" id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
        </div>
        <button type="button" class="btn-ghost" id="clearBtn" data-i18n="common.clearList">清除列表</button>
      </div>
      <ul class="file-queue hidden" id="fileQueue"></ul>
      <div class="preview-row hidden" id="previewRow"><img id="imagePreview" alt="" class="image-preview" data-i18n-aria="common.preview" /></div>
      <div class="exif-panel hidden" id="exifPanel">
        <p class="exif-summary" id="exifSummary"></p>
        <div class="exif-table-wrap">
          <table class="exif-table" id="exifTable">
            <thead><tr><th data-i18n="exif.field">字段</th><th data-i18n="exif.value">内容</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="field-hint hidden" id="exifEmpty" data-i18n="exif.empty">这张图没有发现可展示的拍摄信息。</p>
      </div>
      <div class="controls">
        <button type="button" class="btn-primary btn-primary-image" id="submitBtn" disabled>
          <span class="btn-text" data-i18n="exif.start">清除信息并下载</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </div>
      <div class="status hidden" id="statusBox"><p class="status-text" id="statusText"></p></div>
      <div class="result hidden" id="resultBox">
        <div class="result-icon">✓</div>
        <div class="result-body">
          <p class="result-title" data-i18n="common.done">处理完成</p>
          <p class="result-name" id="resultName"></p>
          <p class="result-note" id="resultMeta"></p>
        </div>
        <a class="btn-download" id="downloadLink" download>下载文件</a>
      </div>
    </main>
    <footer class="footer"><span data-i18n="common.localFreeFooter">本地处理 · 免费 · 文件不会上传到第三方</span></footer>
  </div>
  <script src="/locales.js?v=20261025q"></script>
  <script src="i18n.js?v=20261025i18n"></script>
  <script src="/exif.js?v=20261025q"></script>
</body>
</html>

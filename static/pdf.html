<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pdf.title">PDF 工具</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/styles.css?v=20261025i18n" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="/" data-i18n="nav.all">← 全部工具</a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>
    <header class="header">
      <div class="logo tool-icon-data" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M9 5h10l6 6v16a2 2 0 01-2 2H9a2 2 0 01-2-2V7a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/><path d="M19 5v6h6M12 17h8M12 21h8M12 25h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1 data-i18n="pdf.title">PDF 工具</h1>
        <p class="subtitle" data-i18n="pdf.sub">合并、压缩、拆分，全部在本机处理</p>
      </div>
    </header>

    <main class="card">
      <label class="field">
        <span class="field-label" data-i18n="pdf.action">操作</span>
        <select id="actionSelect" class="select">
          <option value="merge" data-i18n="pdf.merge">合并多个 PDF</option>
          <option value="compress" data-i18n="pdf.compress">压缩 PDF</option>
          <option value="split" data-i18n="pdf.split">拆分 / 提取页</option>
        </select>
        <p class="field-hint" id="actionHint"></p>
      </label>

      <label class="field hidden" id="presetField">
        <span class="field-label" data-i18n="pdf.preset">压缩强度</span>
        <select id="presetSelect" class="select"></select>
      </label>

      <label class="field hidden" id="splitModeField">
        <span class="field-label" data-i18n="pdf.splitMode">拆分方式</span>
        <select id="splitModeSelect" class="select">
          <option value="pages" data-i18n="pdf.split.pages">按页拆成多个 PDF（zip）</option>
          <option value="range" data-i18n="pdf.split.range">提取页码范围（一个 PDF）</option>
        </select>
      </label>

      <label class="field hidden" id="rangeField">
        <span class="field-label" data-i18n="pdf.range">页码范围</span>
        <input type="text" id="rangeInput" class="input" data-i18n-placeholder="pdf.rangePh" placeholder="例如 1-3,5" />
      </label>

      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
      <section class="dropzone" id="dropzone" tabindex="0" role="button">
        <p class="dropzone-title" data-i18n="pdf.drop">拖放 PDF 到此处，或点击选择</p>
        <p class="dropzone-hint" id="dropHint">单文件 80MB · 合并合计 200MB</p>
      </section>

      <div class="file-preview hidden" id="filePreview">
        <div class="file-info">
          <span class="file-name" id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
        </div>
        <button type="button" class="btn-ghost" id="clearBtn" data-i18n="common.clear">清除</button>
      </div>
      <ul class="file-queue hidden" id="fileQueue"></ul>

      <div class="controls">
        <button type="button" class="btn-primary" id="submitBtn" disabled>
          <span class="btn-text" data-i18n="pdf.start">开始处理</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </div>

      <div class="status hidden" id="statusBox"><p class="status-text" id="statusText"></p></div>
      <div class="result hidden" id="resultBox">
        <div class="result-icon">✓</div>
        <div class="result-body">
          <p class="result-title" data-i18n="common.done">处理完成</p>
          <p class="result-name" id="resultName"></p>
          <p class="result-note" id="resultMeta"></p>
        </div>
        <a class="btn-download" id="downloadLink" download>下载文件</a>
      </div>
    </main>
    <footer class="footer"><span data-i18n="common.localFooter">本地处理 · 文件不会上传到第三方</span></footer>
  </div>
  <script src="/locales.js?v=20261025i18n"></script>
  <script src="i18n.js?v=20261025i18n"></script>
  <script src="/pdf.js?v=20261025i18n"></script>
</body>
</html>
